<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלון לתרגול</title>
    <script>
        // שחזור בחירת מצב בהיר/כהה לפני שהדף מצויר, כדי שלא יהבהב
        try {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) document.documentElement.dataset.theme = savedTheme;
        } catch (e) {}
    </script>
    <style>
        :root {
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-gradient-start: #f3e8ff;
            --bg-gradient-end: #fce7f3;
            --card-bg: #ffffff;
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
            --text-color: #1f2937;
            --text-soft: #4b5563;
            --text-muted: #6b7280;
            --heading-color: #b888e3;
            --accent-text: #6d28d9;
            --border-color: #f3e8ff;
            --input-bg: #faf5ff;
            --input-focus-bg: #ffffff;
            --option-bg: #faf5ff;
            --option-border: #f3e8ff;
            --option-hover-bg: #f3e8ff;
            --option-hover-border: #d8b4fe;
            --topic-bg: linear-gradient(135deg, #e9d5ff 0%, #f472b6 100%);
            --topic-hover-bg: linear-gradient(135deg, #d8b4fe 0%, #ec4899 100%);
            --topic-text: #7e3fc4;
            --topic-border: #d8b4fe;
            --pill-bg: #faf5ff;
            --pill-border: #ddd6fe;
            --pill-text: #7c3aed;
            --success-color: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-color: #ef4444;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --combo-bg: #fff7ed;
            --combo-border: #fdba74;
            --combo-text: #c2410c;
            --bar-track: rgba(255, 255, 255, 0.6);
            --bar-fill: #7c3aed;
            color-scheme: light;
        }

        /* מצב כהה: לפי הגדרת הטלפון, או לפי הכפתור בתחתית הדף */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-gradient-start: #1a1024;
                --bg-gradient-end: #26101f;
                --card-bg: #1f1827;
                --card-border: #2f2540;
                --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
                --text-color: #ede9f5;
                --text-soft: #c9c1d8;
                --text-muted: #a99fbb;
                --heading-color: #d8b4fe;
                --accent-text: #c4b5fd;
                --border-color: #3b2d4a;
                --input-bg: #271e32;
                --input-focus-bg: #2d2339;
                --option-bg: #271e32;
                --option-border: #3b2d4a;
                --option-hover-bg: #2f2540;
                --option-hover-border: #7c3aed;
                --topic-bg: linear-gradient(135deg, #3b2154 0%, #6b2150 100%);
                --topic-hover-bg: linear-gradient(135deg, #4c2a6e 0%, #86295f 100%);
                --topic-text: #f5d0fe;
                --topic-border: #5b3a7a;
                --pill-bg: #271e32;
                --pill-border: #4c3a66;
                --pill-text: #d8b4fe;
                --success-bg: #0f3b2d;
                --success-text: #a7f3d0;
                --error-bg: #4a1d1d;
                --error-text: #fecaca;
                --combo-bg: #3a2413;
                --combo-border: #9a4a1c;
                --combo-text: #fdba74;
                --bar-track: rgba(255, 255, 255, 0.14);
                --bar-fill: #d8b4fe;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg-gradient-start: #1a1024;
            --bg-gradient-end: #26101f;
            --card-bg: #1f1827;
            --card-border: #2f2540;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --text-color: #ede9f5;
            --text-soft: #c9c1d8;
            --text-muted: #a99fbb;
            --heading-color: #d8b4fe;
            --accent-text: #c4b5fd;
            --border-color: #3b2d4a;
            --input-bg: #271e32;
            --input-focus-bg: #2d2339;
            --option-bg: #271e32;
            --option-border: #3b2d4a;
            --option-hover-bg: #2f2540;
            --option-hover-border: #7c3aed;
            --topic-bg: linear-gradient(135deg, #3b2154 0%, #6b2150 100%);
            --topic-hover-bg: linear-gradient(135deg, #4c2a6e 0%, #86295f 100%);
            --topic-text: #f5d0fe;
            --topic-border: #5b3a7a;
            --pill-bg: #271e32;
            --pill-border: #4c3a66;
            --pill-text: #d8b4fe;
            --success-bg: #0f3b2d;
            --success-text: #a7f3d0;
            --error-bg: #4a1d1d;
            --error-text: #fecaca;
            --combo-bg: #3a2413;
            --combo-border: #9a4a1c;
            --combo-text: #fdba74;
            --bar-track: rgba(255, 255, 255, 0.14);
            --bar-fill: #d8b4fe;
            color-scheme: dark;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px 14px 28px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* במחשב הכרטיס יושב קצת יותר נמוך; בטלפון הוא צמוד למעלה כדי שלא יקפוץ בין שאלות */
        @media (min-width: 600px) {
            body {
                padding-top: 8vh;
            }
        }

        .container {
            position: relative;
            background: var(--card-bg);
            padding: 28px 20px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            border: 1px solid var(--card-border);
        }

        @media (min-width: 600px) {
            .container {
                padding: 32px 28px;
            }
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--heading-color);
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: var(--text-soft);
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 18px;
            letter-spacing: 6px;
            text-align: center;
            color: var(--text-color);
            background-color: var(--input-bg);
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--primary-color);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        button {
            width: 100%;
            min-height: 52px;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        /* אפקט ריחוף רק במכשירים עם עכבר, כדי שבטלפון הכפתור לא "יתקע" במצב ריחוף */
        @media (hover: hover) {
            button:hover {
                opacity: 0.95;
                transform: translateY(-1px);
            }
        }

        .hidden {
            display: none !important;
        }

        .topic-btn {
            background: var(--topic-bg);
            color: var(--topic-text);
            border: 1px solid var(--topic-border);
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(192, 132, 252, 0.15);
            font-weight: 900; /* עובי גופן מודגש במיוחד (Extra Bold) */
            font-size: 17px; /* הגדלה קלה של הכתב לקריאות מיטבית */
            letter-spacing: 0.5px; /* מרווח קל בין האותיות */
            cursor: pointer;
            transition: all 0.2s ease;
        }

        @media (hover: hover) {
            .topic-btn:hover {
                background: var(--topic-hover-bg);
                color: #ffffff;
                border-color: #c084fc;
                transform: translateY(-1px);
            }
        }

        .option-label {
            display: flex;
            align-items: center;
            min-height: 52px;
            box-sizing: border-box;
            background: var(--option-bg);
            border: 2px solid var(--option-border);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1.45;
            transition: all 0.2s;
        }

        @media (hover: hover) {
            .option-label:hover {
                border-color: var(--option-hover-border);
                background-color: var(--option-hover-bg);
            }
        }

        .option-label:not(.answered):has(input:checked) {
            border-color: var(--primary-color);
            background-color: var(--option-hover-bg);
        }

        .option-label input {
            flex: none;
            margin: 0 0 0 12px;
            width: 22px;
            height: 22px;
            accent-color: #9333ea;
        }

        /* סימון התשובות לאחר בדיקה */
        .option-label.answered {
            cursor: default;
        }

        .option-label.correct-option,
        .option-label.correct-option:hover {
            background-color: var(--success-bg);
            border-color: var(--success-color);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-label.correct-option::after {
            content: "✓";
            margin-right: auto;
            padding-right: 8px;
            font-weight: bold;
            color: var(--success-color);
        }

        .option-label.wrong-option,
        .option-label.wrong-option:hover {
            background-color: var(--error-bg);
            border-color: var(--error-color);
            color: var(--error-text);
        }

        .option-label.wrong-option::after {
            content: "✗";
            margin-right: auto;
            padding-right: 8px;
            font-weight: bold;
            color: var(--error-color);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        .stats {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
        }

        /* כפתור חזרה אליפטי למעלה */
        .back-oval-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-height: 36px;
            padding: 6px 16px;
            background: var(--pill-bg);
            color: var(--pill-text);
            border: 2px solid var(--pill-border);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(139, 92, 246, 0.1);
            transition: all 0.2s ease;
            margin-top: 0;
            white-space: nowrap;
        }

        @media (hover: hover) {
            .back-oval-btn:hover {
                background: var(--option-hover-bg);
                border-color: #c084fc;
                transform: translateY(-1px);
            }
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .question-text {
            font-weight: 600;
            font-size: 18px;
            line-height: 1.55;
            color: var(--text-color);
            margin: 0 0 20px;
        }

        /* מונה תשובות נכונות ברצף */
        .combo {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 50px;
            background: var(--combo-bg);
            border: 2px solid var(--combo-border);
            color: var(--combo-text);
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .combo.bump {
            animation: combo-bump 0.35s ease;
        }

        .combo-burst {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 26px;
            border-radius: 50px;
            background: linear-gradient(135deg, #f97316 0%, #db2777 100%);
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.35);
            pointer-events: none;
            z-index: 5;
            animation: combo-burst 1.6s ease forwards;
        }

        .confetti {
            position: absolute;
            top: 38%;
            left: 50%;
            width: 9px;
            height: 9px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 4;
            animation: confetti-fly 1.1s ease-out forwards;
        }

        @keyframes combo-bump {
            50% { transform: scale(1.25); }
        }

        @keyframes combo-burst {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            25% { transform: translate(-50%, -50%) scale(1); }
            75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.95); }
        }

        @keyframes confetti-fly {
            0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .combo.bump, .confetti { animation: none; }
            .confetti { display: none; }
            .combo-burst { animation-duration: 2.2s; }
        }

        /* פס התקדמות בתוך כפתור הנושא */
        .topic-btn {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .topic-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .topic-progress .bar {
            flex: 1;
            height: 8px;
            border-radius: 8px;
            background: var(--bar-track);
            overflow: hidden;
        }

        .topic-progress .bar i {
            display: block;
            height: 100%;
            border-radius: 8px;
            background: var(--bar-fill);
            transition: width 0.4s ease;
        }

        .topic-btn.complete .bar i {
            background: var(--success-color);
        }

        .topic-progress .count {
            min-width: 48px;
            font-variant-numeric: tabular-nums;
        }

        .mistakes-btn {
            background: var(--combo-bg);
            color: var(--combo-text);
            border: 2px solid var(--combo-border);
            box-shadow: none;
            margin: 0 0 16px;
        }

        .mistakes-btn:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }

        .reset-btn {
            width: auto;
            min-height: 40px;
            display: block;
            margin: 6px auto 0;
            padding: 8px 12px;
            background: none;
            color: var(--text-muted);
            box-shadow: none;
            font-size: 14px;
            font-weight: 600;
            text-decoration: underline;
        }

        .theme-btn {
            width: auto;
            min-height: 40px;
            margin-top: 16px;
            padding: 8px 18px;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- מסך כניסה -->
        <div id="login-screen">
            <h2>כניסה למערכת</h2>
            <p style="text-align: center; font-size: 14px; margin-bottom: 16px;">הכנס את קוד הגישה כדי להתחיל</p>
            <input type="password" id="passcode" placeholder="••••" maxlength="4">
            <button id="login-btn" class="topic-btn">כניסה</button>
            <p id="login-error" style="color: var(--error-color); text-align: center; font-size: 14px; margin-top: 12px;" class="hidden">קוד שגוי, נסה שוב</p>
        </div>

        <!-- מסך בחירת נושאים -->
        <div id="topics-screen" class="hidden">
            <h2>בחר נושא לתרגול</h2>
            <div id="topics-list" style="margin-top: 20px;">
                <!-- כאן יופיעו הנושאים דינמית -->
            </div>
        </div>
        <!-- מסך שאלון -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <div class="stats" id="queue-stats">שאלות בתור: 0</div>
                <div class="combo hidden" id="combo" aria-live="polite"></div>
                <button class="back-oval-btn" id="header-back-btn">← נושאים</button>
            </div>
            <h3 id="question-title" style="color: var(--accent-text); margin-top: 0;"></h3>
            <p id="question-text" class="question-text"></p>
            <img id="question-image" class="hidden" alt="" style="display: block; max-width: 100%; margin: 0 auto 20px; border-radius: 12px;">
            <div id="options-container"></div>
            <button id="submit-btn">בדוק תשובה</button>
            <button id="next-btn" class="hidden">השאלה הבאה</button>
            <div id="feedback" class="feedback hidden"></div>
        </div>
        <!-- מסך סיום -->
        <div id="finish-screen" class="hidden" style="text-align: center;">
            <h2 style="margin-bottom: 10px;">כל הכבוד! 🎉</h2>
            <p id="finish-text" style="margin-bottom: 20px;">סיימת את כל השאלות בהצלחה.</p>
            <button id="back-btn">בחר נושא אחר</button>
        </div>
    </div>
    <button class="theme-btn" id="theme-btn" type="button"></button>
  
    <script>

                    answer: [2]
                },
                {
                    id: 9,

        let currentQueue = [];

        const CORRECT_CODE = "4002";

        // תשובות כמו "כל התשובות נכונות" נשארות תמיד אחרונות
        const PINNED_LAST = /^(כל התשובות|אף תשובה|אף אחת)/;
        // שאלה שתשובה בה מפנה לתשובות אחרות ("תשובות א ו-ב נכונות") לא מערבבים
        const REFERS_TO_OPTIONS = /תשובות [א-ד1-4]/;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function optionOrder(options) {
            const indexes = options.map((_, i) => i);
            if (options.some(opt => REFERS_TO_OPTIONS.test(opt))) return indexes;
            const free = indexes.filter(i => !PINNED_LAST.test(options[i]));
            const pinned = indexes.filter(i => PINNED_LAST.test(options[i]));
            return shuffle(free).concat(pinned);
        }

        function updateCombo() {
            const comboEl = document.getElementById("combo");
            if (combo < 2) {
                comboEl.classList.add("hidden");
                return;
            }
            comboEl.textContent = `🔥 ${combo} ברצף`;
            comboEl.classList.remove("hidden", "bump");
            void comboEl.offsetWidth; // הפעלה מחדש של האנימציה
            comboEl.classList.add("bump");
            if (combo % 5 === 0) celebrate();
        }

        // חגיגה קטנה כל 5 תשובות נכונות ברצף
        function celebrate() {
            const box = document.querySelector(".container");
            const burst = document.createElement("div");
            burst.className = "combo-burst";
            burst.textContent = `🔥 ${combo} ברצף!`;
            box.appendChild(burst);
            setTimeout(() => burst.remove(), 1700);

            const colors = ["#9333ea", "#db2777", "#f97316", "#facc15", "#10b981", "#60a5fa"];
            for (let i = 0; i < 18; i++) {
                const piece = document.createElement("span");
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 90;
                piece.className = "confetti";
                piece.style.background = colors[i % colors.length];
                piece.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
                piece.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
                piece.style.setProperty("--rot", `${Math.round(Math.random() * 540 - 270)}deg`);
                box.appendChild(piece);
                setTimeout(() => piece.remove(), 1200);
            }
        }

        function currentTheme() {
            return document.documentElement.dataset.theme ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        }

        function updateThemeButton() {
            document.getElementById("theme-btn").textContent =
                currentTheme() === "dark" ? "☀️ מצב בהיר" : "🌙 מצב כהה";
        }

        function toggleTheme() {
            const next = currentTheme() === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem("theme", next); } catch (e) {}
            updateThemeButton();
        }

        // התקדמות שמורה בטלפון: לכל שאלה כמה פעמים ברצף נענתה נכון (s) והאם היא בטעויות (w)
        // המפתח הוא נושא + טקסט השאלה, כך שהוספת שאלות חדשות לא מבלבלת את ההתקדמות
        const PROGRESS_KEY = "kakatz-progress";
        const MASTERED_STREAK = 2;
        let progress = loadProgress();
        let mistakesMode = false;
        const questionTopic = new Map();
        for (const topic in database) {
            database[topic].forEach(q => questionTopic.set(q, topic));
        }

        function loadProgress() {
            try {
                return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveProgress() {
            try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
        }

        function progressKey(q) {
            return `${questionTopic.get(q)}|${q.text}`;
        }

        function questionState(q) {
            return progress[progressKey(q)] || { s: 0, w: false };
        }

        function isMastered(q) {
            return questionState(q).s >= MASTERED_STREAK;
        }

        function isMistake(q) {
            return questionState(q).w;
        }

        // תשובה שגויה מאפסת את הרצף ומכניסה לטעויות; 2 נכונות ברצף מוציאות מהטעויות
        function recordAnswer(q, correct) {
            const state = questionState(q);
            const streak = correct ? state.s + 1 : 0;
            progress[progressKey(q)] = {
                s: streak,
                w: correct ? state.w && streak < MASTERED_STREAK : true
            };
            saveProgress();
        }

        function allMistakes() {
            return Object.values(database).flat().filter(isMistake);
        }

        function resetProgress() {
            if (!confirm("למחוק את כל ההתקדמות השמורה בטלפון הזה?")) return;
            progress = {};
            saveProgress();
            loadTopics();
        }

        function showTopics() {
            loadTopics();
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("finish-screen").classList.add("hidden");
            document.getElementById("topics-screen").classList.remove("hidden");
        }

        function checkLogin() {
            const code = document.getElementById("passcode").value;
            if (code === CORRECT_CODE) {
                document.getElementById("login-screen").classList.add("hidden");
                loadTopics();
                document.getElementById("topics-screen").classList.remove("hidden");
            } else {
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        function loadTopics() {
            const listContainer = document.getElementById("topics-list");
            listContainer.innerHTML = "";

            const mistakesCount = allMistakes().length;
            const mistakesBtn = document.createElement("button");
            mistakesBtn.className = "mistakes-btn";
            mistakesBtn.disabled = mistakesCount === 0;
            mistakesBtn.innerText = mistakesCount
                ? `🎯 תרגול הטעויות שלי (${mistakesCount})`
                : "🎯 אין טעויות לתרגל כרגע";
            mistakesBtn.onclick = startMistakes;
            listContainer.appendChild(mistakesBtn);

            for (const topic in database) {
                const total = database[topic].length;
                const mastered = database[topic].filter(isMastered).length;
                const percent = Math.round((mastered / total) * 100);
                const btn = document.createElement("button");
                btn.className = "topic-btn" + (mastered === total ? " complete" : "");
                btn.innerHTML = `
                    <span>תרגל נושא: ${topic}</span>
                    <span class="topic-progress">
                        <span class="bar"><i style="width: ${percent}%"></i></span>
                        <span class="count">${mastered === total ? "✔ " : ""}${mastered}/${total}</span>
                    </span>
                `;
                btn.setAttribute("aria-label", `תרגל נושא: ${topic}, נלמדו ${mastered} מתוך ${total}`);
                btn.onclick = () => startQuiz(topic);
                listContainer.appendChild(btn);
            }

            const resetBtn = document.createElement("button");
            resetBtn.className = "reset-btn";
            resetBtn.innerText = "איפוס ההתקדמות";
            resetBtn.onclick = resetProgress;
            listContainer.appendChild(resetBtn);
        }

        function startQuiz(topic) {
            mistakesMode = false;
            beginQueue(shuffle([...database[topic]]));
        }

        // תרגול הטעויות: כל השאלות שטעית בהן, מכל הנושאים, עד ששתיים נכונות ברצף מוציאות אותן
        function startMistakes() {
            mistakesMode = true;
            beginQueue(shuffle(allMistakes()));
        }

        function beginQueue(queue) {
            currentQueue = queue;
            combo = 0;
            updateCombo();
            document.getElementById("topics-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQueue.length === 0) {
                document.getElementById("finish-text").innerText = mistakesMode
                    ? "ניקית את כל הטעויות 💪"
                    : "סיימת את כל השאלות בהצלחה.";
                document.getElementById("quiz-screen").classList.add("hidden");
                document.getElementById("finish-screen").classList.remove("hidden");
                return;
            }

            currentQuestion = currentQueue[0];
            document.getElementById("queue-stats").innerText = `שאלות בתור: ${currentQueue.length}`;
            // בתרגול הטעויות השאלות מגיעות מכל הנושאים, אז מציגים מאיזה נושא כל שאלה
            document.getElementById("question-title").innerText = mistakesMode ? questionTopic.get(currentQuestion) : "";
            document.getElementById("question-text").innerText = currentQuestion.text;

            const imageEl = document.getElementById("question-image");
            if (currentQuestion.image) {
                imageEl.src = currentQuestion.image;
                imageEl.classList.remove("hidden");
            } else {
                imageEl.removeAttribute("src");
                imageEl.classList.add("hidden");
            }
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const inputType = currentQuestion.type === "multi" ? "checkbox" : "radio";

            // סדר התשובות מתערבב בכל פעם; value שומר את המיקום המקורי לבדיקה
            optionOrder(currentQuestion.options).forEach(index => {
                const label = document.createElement("label");
                label.className = "option-label";
                label.innerHTML = `
                    <input type="${inputType}" name="quiz-option" value="${index}">
                    ${currentQuestion.options[index]}
                `;
                optionsContainer.appendChild(label);
            });

            document.getElementById("feedback").classList.add("hidden");
            document.getElementById("submit-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            window.scrollTo({ top: 0 });
        }

        function checkAnswer() {
            const selectedInputs = document.querySelectorAll('input[name="quiz-option"]:checked');
            if (selectedInputs.length === 0) {
                alert("נא לבחור לפחות תשובה אחת");
                return;
            }

            const selectedValues = Array.from(selectedInputs).map(input => parseInt(input.value));
            
            const isCorrect = 
                selectedValues.length === currentQuestion.answer.length &&
                selectedValues.every(val => currentQuestion.answer.includes(val));

            currentQueue.shift();

            // סימון התשובה הנכונה (ירוק) והבחירה השגויה (אדום) ישירות באפשרויות
            document.querySelectorAll('input[name="quiz-option"]').forEach(input => {
                const index = parseInt(input.value);
                const label = input.closest(".option-label");
                input.disabled = true;
                label.classList.add("answered");
                if (currentQuestion.answer.includes(index)) {
                    label.classList.add("correct-option");
                } else if (input.checked) {
                    label.classList.add("wrong-option");
                }
            });

            recordAnswer(currentQuestion, isCorrect);

            // שאלה שנענתה לא נכון חוזרת בהמשך; בתרגול הטעויות היא חוזרת עד שהיא יוצאת מהטעויות
            if (!isCorrect || (mistakesMode && isMistake(currentQuestion))) {
                currentQueue.push(currentQuestion);
            }

            combo = isCorrect ? combo + 1 : 0;
            updateCombo();

            document.getElementById("submit-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
        }

        document.getElementById("login-btn").addEventListener("click", checkLogin);
        document.getElementById("passcode").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') checkLogin();
        });
        document.getElementById("submit-btn").addEventListener("click", checkAnswer);
        document.getElementById("next-btn").addEventListener("click", loadNextQuestion);
        document.getElementById("back-btn").addEventListener("click", showTopics);
        document.getElementById("header-back-btn").addEventListener("click", showTopics);
        document.getElementById("theme-btn").addEventListener("click", toggleTheme);
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
        updateThemeButton();
    </script>
</body>
</html>
