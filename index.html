<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלון לתרגול</title>
    <style>
        :root {
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-gradient-start: #fdf4ff;
            --bg-gradient-end: #fae8ff;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #f3e8ff;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #7de6e8;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: #4b5563;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            background-color: #faf5ff;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        .topic-btn {
            background: linear-gradient(135deg, #e9d5ff 0%, #f472b6 100%); /* סגול לילך בהיר משולב עם ורוד רך */
            color: #4c1d95; /* טקסט סגול כהה וקריא */
            border: 2px solid #c084fc;
            margin-bottom: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(192, 132, 252, 0.2);
        }

        .topic-btn:hover {
            background: linear-gradient(135deg, #d8b4fe 0%, #ec4899 100%); /* מודגש מעט במעבר עכבר */
            color: #3b0764;
            border-color: #a855f7;
        }

        .option-label {
            display: flex;
            align-items: center;
            background: #faf5ff;
            border: 2px solid #f3e8ff;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: #d8b4fe;
            background-color: #f3e8ff;
        }

        .option-label input {
            margin-left: 12px;
            width: 20px;
            height: 20px;
            accent-color: #9333ea;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        .feedback.correct {
            background-color: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .stats {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
        }
        /* כפתור חזרה אליפטי למעלה */
        .back-oval-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            padding: 6px 16px;
            background: #faf5ff;
            color: #7c3aed;
            border: 2px solid #ddd6fe;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(139, 92, 246, 0.1);
            transition: all 0.2s ease;
            margin-top: 0;
        }
        .back-oval-btn:hover {
            background: #f3e8ff;
            border-color: #c084fc;
            color: #6d28d9;
            transform: translateY(-1px);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
    </style>
</head>

            <div id="options-container"></div>
            <button id="submit-btn">בדוק תשובה</button>
            <button id="next-btn" class="hidden">השאלה הבאה</button>
            <div id="feedback" class="feedback hidden"></div>
        </div>
        <!-- מסך סיום -->

    </div>

        let currentQueue = [];
        let currentQuestion = null;
        const CORRECT_CODE = "4002";

        function checkLogin() {
            const code = document.getElementById("passcode").value;
            if (code === CORRECT_CODE) {
                document.getElementById("login-screen").classList.add("hidden");
                loadTopics();
                document.getElementById("topics-screen").classList.remove("hidden");
            } else {
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        function loadTopics() {
            const listContainer = document.getElementById("topics-list");
            listContainer.innerHTML = "";

            for (const topic in database) {
                const btn = document.createElement("button");
                btn.className = "topic-btn";
                btn.innerText = `תרגל נושא: ${topic}`;
                btn.onclick = () => startQuiz(topic);
                listContainer.appendChild(btn);
            }
        }

        function startQuiz(topic) {
            currentQueue = [...database[topic]].sort(() => Math.random() - 0.5);
            document.getElementById("topics-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQueue.length === 0) {
                document.getElementById("quiz-screen").classList.add("hidden");
                document.getElementById("finish-screen").classList.remove("hidden");
                return;
            }

            currentQuestion = currentQueue[0];
            document.getElementById("queue-stats").innerText = `שאלות שנותרו בתור: ${currentQueue.length}`;
            document.getElementById("question-text").innerText = currentQuestion.text;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const inputType = currentQuestion.type === "multi" ? "checkbox" : "radio";

            currentQuestion.options.forEach((opt, index) => {
                const label = document.createElement("label");
                label.className = "option-label";
                label.innerHTML = `
                    <input type="${inputType}" name="quiz-option" value="${index}">
                    ${opt}
                `;
                optionsContainer.appendChild(label);
            });

            document.getElementById("feedback").classList.add("hidden");
            document.getElementById("submit-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
        }

        function checkAnswer() {
            const selectedInputs = document.querySelectorAll('input[name="quiz-option"]:checked');
            if (selectedInputs.length === 0) {
                alert("נא לבחור לפחות תשובה אחת");
                return;
            }

            const selectedValues = Array.from(selectedInputs).map(input => parseInt(input.value));
            
            const isCorrect = 
                selectedValues.length === currentQuestion.answer.length &&
                selectedValues.every(val => currentQuestion.answer.includes(val));

            const feedbackEl = document.getElementById("feedback");
            feedbackEl.classList.remove("hidden");

            currentQueue.shift();

            if (isCorrect) {
                feedbackEl.className = "feedback correct";
                feedbackEl.innerText = "תשובה נכונה!";
            } else {
                feedbackEl.className = "feedback incorrect";
                const correctTexts = currentQuestion.answer.map(idx => currentQuestion.options[idx]).join(', ');
                feedbackEl.innerText = `תשובה שגויה. התשובה הנכונה היא: ${correctTexts}. השאלה תחזור בהמשך`;
                currentQueue.push(currentQuestion);
            }

            document.getElementById("submit-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
        }

        document.getElementById("login-btn").addEventListener("click", checkLogin);
        document.getElementById("passcode").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') checkLogin();
        });
        document.getElementById("submit-btn").addEventListener("click", checkAnswer);
        document.getElementById("next-btn").addEventListener("click", loadNextQuestion);
        document.getElementById("back-btn").addEventListener("click", function() {
            document.getElementById("finish-screen").classList.add("hidden");
            document.getElementById("topics-screen").classList.remove("hidden");
        });
        document.getElementById("header-back-btn").addEventListener("click", function() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("topics-screen").classList.remove("hidden");
        });
    </script>
