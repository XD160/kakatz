<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלון לתרגול</title>
    <style>
        :root {
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-gradient-start: #fdf4ff;
            --bg-gradient-end: #fae8ff;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #f3e8ff;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #6d28d9;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: #4b5563;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            background-color: #faf5ff;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        .topic-btn {
            background-color: #ffffff;
            color: #7c3aed;
            border: 2px solid #ddd6fe;
            margin-bottom: 12px;
            box-shadow: none;
            font-weight: 600;
        }

        .topic-btn:hover {
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
        }

        .option-label {
            display: flex;
            align-items: center;
            background: #faf5ff;
            border: 2px solid #f3e8ff;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: #d8b4fe;
            background-color: #f3e8ff;
        }

        .option-label input {
            margin-left: 12px;
            width: 20px;
            height: 20px;
            accent-color: #9333ea;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

            background-color: #d1fae5;
            color: #065f4
